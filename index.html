<title>隨手記帳</title>
<style>
:root{
  --paper:#ECEFE9;
  --slip:#FFFFFF;
  --ink:#1C2541;
  --muted:#667085;
  --rule:#D6DAD0;
  --red:#C8283E;
  --jade:#12806A;
  --marker:#FFE45C;
  --ui:"Microsoft JhengHei UI","Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;
  --num:"Bahnschrift","DIN Alternate","Segoe UI",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.6 var(--ui);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 28px;max-width:1280px;margin:0 auto}
.brand{display:flex;align-items:center;gap:12px}
.seal{display:inline-grid;place-items:center;width:38px;height:38px;border:2px solid var(--red);color:var(--red);border-radius:6px;font-weight:700;font-size:20px;transform:rotate(-4deg)}
.brand h1{margin:0;font-size:22px;letter-spacing:.08em}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--rule);background:#fff;border-radius:8px;padding:6px 12px;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.danger{color:var(--red);border-color:#EBC3C9}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* summary */
.summary{max-width:1280px;margin:0 auto;padding:4px 28px 22px;display:grid;grid-template-columns:auto 1fr;gap:12px 40px;align-items:end}
.period{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.period .arrow:disabled{opacity:.35;cursor:not-allowed}
.period .arrow{width:34px;height:34px;border-radius:50%;border:1px solid var(--rule);background:#fff;font-size:18px;line-height:1}
.period .label strong{display:block;font-size:20px;line-height:1.2}
.period .label small{color:var(--muted);font-size:12px}
.period select,.period input{border:1px solid var(--rule);background:#fff;border-radius:8px;padding:5px 8px;font-size:14px}
.totals{display:flex;gap:44px;justify-content:flex-end;flex-wrap:wrap}
.total span{display:block;font-size:13px;color:var(--muted)}
.total b{font-family:var(--num);font-weight:600;font-size:40px;line-height:1.05;font-variant-numeric:tabular-nums}
.total.exp b{color:var(--red)}
.total.inc b{color:var(--jade)}
.breakdown{grid-column:1/-1}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:#DDE1D8}
.bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:8px;font-size:13px}
.legend button{background:none;border:0;padding:2px 0;display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.legend button:hover span{text-decoration:underline}
.legend .dot{width:9px;height:9px;border-radius:2px}
.legend em{font-style:normal;color:var(--muted);font-family:var(--num)}

/* tabs */
.tabs{max-width:1280px;margin:0 auto 20px;padding:0 28px;display:flex;gap:2px;border-bottom:1px solid var(--rule);overflow-x:auto}
.tabs button{background:none;border:0;padding:10px 18px;font-size:15px;color:var(--muted);border-bottom:2.5px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);font-weight:700;border-color:var(--ink)}
.tabs .n{font-family:var(--num);font-size:12px;font-weight:400;color:var(--muted);margin-left:5px}
.wrap{max-width:1280px;margin:0 auto;padding:0 28px 60px}
.entrygrid{display:grid;grid-template-columns:420px 1fr;gap:36px;align-items:start}

/* 記帳頁右側 */
.recent h3{margin:6px 0 12px;font-size:17px}
.todays{display:flex;gap:32px;margin-bottom:22px}
.todays span{display:block;font-size:13px;color:var(--muted)}
.todays b{font-family:var(--num);font-size:28px;font-weight:600}
.recent .more{margin-top:12px}

/* 卡別選擇 */
.subpick{margin-top:10px;padding:10px 12px;background:#F4F6F1;border-radius:8px}
.subpick .lab2{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
.chips.small span{font-size:13px;padding:2px 10px}

/* 卡片統計 */
.cardtop{display:flex;gap:28px 48px;align-items:flex-end;flex-wrap:wrap;margin-bottom:22px}
.cardtop .big span{display:block;font-size:13px;color:var(--muted)}
.cardtop .big b{font-family:var(--num);font-size:40px;font-weight:600;line-height:1.05}
.share{flex:1;min-width:260px}
.share .bar{height:14px}
.share .legend{margin-top:6px}
.banks{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:24px;margin-bottom:30px}
.bank{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 1px 0 var(--rule),0 12px 28px -20px rgba(28,37,65,.4)}
.face{background:var(--bc);color:#fff;padding:18px 22px 16px;position:relative;min-height:132px}
.face::after{content:"";position:absolute;right:22px;top:20px;width:38px;height:28px;border-radius:6px;background:linear-gradient(135deg,#F1DC9A,#C9A85A);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.face .nm{font-size:18px;font-weight:700;letter-spacing:.12em}
.face b{display:block;font-family:var(--num);font-size:36px;font-weight:600;margin-top:16px;line-height:1.1}
.face small{opacity:.85;font-size:13px}
.bank .body{padding:6px 22px 20px}
.bank h4{font-size:13px;color:var(--muted);font-weight:400;margin:16px 0 6px}
.hrow{display:grid;grid-template-columns:78px 1fr 86px;gap:10px;align-items:center;font-size:14px;padding:3px 0}
.hrow .track{height:8px;background:#EEF0EA;border-radius:4px;overflow:hidden}
.hrow .track i{display:block;height:100%;border-radius:4px}
.hrow .v{text-align:right;font-family:var(--num);font-variant-numeric:tabular-nums}
.mrow{display:grid;grid-template-columns:44px 1fr auto;gap:10px;font-size:14px;padding:6px 0;border-bottom:1px solid #EEF0EA;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.mrow:hover{background:#F8F9F6}
.mrow .d{color:var(--muted);font-family:var(--num)}
.mrow .it{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.mrow .it small{color:var(--muted)}
.mrow .v{font-family:var(--num);color:var(--red)}
.refund{font-size:13px;color:var(--jade);margin-top:10px}
.bank .btn{margin-top:14px}
.trend{background:#fff;border-radius:14px;padding:18px 22px;box-shadow:0 1px 0 var(--rule)}
.trend h3{margin:0 0 12px;font-size:16px}
.trend table{width:100%;border-collapse:collapse;font-size:14px}
.trend th{font-weight:400;color:var(--muted);text-align:left;padding:4px 8px;font-size:13px}
.trend td{padding:7px 8px;border-top:1px solid #EEF0EA;vertical-align:middle}
.trend td.v{text-align:right;font-family:var(--num);white-space:nowrap}
.tbar{display:flex;align-items:center;gap:8px}
.tbar i{display:block;height:8px;border-radius:4px;min-width:2px}
.trend tr.cur td{background:#F6F8F3;font-weight:600}

/* receipt slip */
.slip{position:sticky;top:16px;background:var(--slip);padding:22px 22px 34px;border-radius:10px 10px 0 0;box-shadow:0 1px 0 var(--rule),0 12px 30px -18px rgba(28,37,65,.35)}
.slip::after{content:"";position:absolute;left:0;right:0;bottom:-10px;height:10px;
  background:radial-gradient(circle at 8px 0,transparent 0 0,var(--slip) 0) ;
  -webkit-mask:radial-gradient(circle at 8px 10px,transparent 6px,#000 6.5px) 0 0/16px 10px repeat-x;
          mask:radial-gradient(circle at 8px 10px,transparent 6px,#000 6.5px) 0 0/16px 10px repeat-x;
  background:var(--slip)}
.slip h2{margin:0 0 14px;font-size:17px;display:flex;justify-content:space-between;align-items:baseline}
.slip h2 small{font-weight:400;color:var(--muted);font-size:12px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--rule);border-radius:9px;padding:3px;gap:3px;margin-bottom:16px}
.seg button{border:0;background:none;border-radius:6px;padding:7px 0;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"].e{background:var(--red);color:#fff}
.seg button[aria-pressed="true"].i{background:var(--jade);color:#fff}

.drop{display:block;border:1.5px dashed #B9BFB2;border-radius:10px;padding:14px;text-align:center;color:var(--muted);font-size:14px;margin-bottom:16px;background:#F8F9F6}
.drop.over{border-color:var(--ink);background:#EEF1F7}
.drop .acts{display:flex;justify-content:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.preview{display:none;gap:12px;align-items:flex-start;text-align:left}
.preview img{width:92px;height:92px;object-fit:cover;border-radius:8px;border:1px solid var(--rule);flex:none}
.preview .side{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.drop.has .preview{display:flex}
.drop.has .empty{display:none}
.ocrstat{font-size:12px;color:var(--muted)}
.cands{display:flex;flex-wrap:wrap;gap:6px;margin:-6px 0 14px}
.cands:empty{display:none}
.cand{border:1px solid var(--rule);background:#fff;border-radius:14px;padding:2px 10px;font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cand.amt{font-family:var(--num);border-color:#C9CFE0}
.cand:hover{border-color:var(--ink)}

.field{margin-bottom:14px}
.field>label,.field>.lab{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.inp[type=date]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;text-align:left;min-height:42px}
.inp{width:100%;border:1px solid var(--rule);border-radius:8px;padding:9px 11px;background:#fff}
.inp:focus{border-color:var(--ink);outline:none;box-shadow:0 0 0 3px rgba(28,37,65,.1)}
.amount{display:flex;align-items:baseline;border-bottom:2px solid var(--ink);padding:2px 0}
.amount span{font-family:var(--num);font-size:22px;color:var(--muted);margin-right:6px}
.amount input{border:0;outline:none;width:100%;font-family:var(--num);font-size:38px;font-weight:600;background:none;padding:0;font-variant-numeric:tabular-nums}
.amount:focus-within{border-color:var(--red)}
@keyframes flash{from{background:#FFF1A0}to{background:transparent}}
.amount.flash{animation:flash 1.4s ease-out}
.slip.inc .amount:focus-within{border-color:var(--jade)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips label{position:relative}
.chips input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chips span{display:inline-block;border:1px solid var(--rule);border-radius:16px;padding:4px 12px;font-size:14px;background:#fff}
.chips input:checked+span{background:var(--ink);color:#fff;border-color:var(--ink)}
.chips input:focus-visible+span{outline:2px solid var(--ink);outline-offset:2px}
.auto{font-size:13px;color:var(--muted);margin:2px 0 6px;min-height:20px}
.auto b{color:var(--ink);font-weight:600}
.lookup{border-top:1px dashed var(--rule);padding-top:12px;margin:4px 0 16px}
.lookup .lab{font-size:13px;color:var(--muted);margin-bottom:6px}
.lookup .links{display:flex;flex-wrap:wrap;gap:6px}
.lookup .links button{border:1px solid var(--rule);background:#F8F9F6;border-radius:7px;padding:3px 10px;font-size:13px}
.lookup .links button:hover:not(:disabled){border-color:var(--ink);background:#fff}
.lookup .links button:disabled{opacity:.4;cursor:not-allowed}
.submit{display:flex;gap:8px}
.submit .go{flex:1;padding:11px;border:0;border-radius:9px;background:var(--red);color:#fff;font-weight:700;font-size:16px;letter-spacing:.1em}
.slip.inc .submit .go{background:var(--jade)}

/* ledger */
.filters{display:grid;grid-template-columns:1fr auto;gap:10px;margin-bottom:10px}
.search{position:relative}
.search input{width:100%;border:1px solid var(--rule);border-radius:10px;padding:10px 12px 10px 36px;background:#fff}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.fsel{display:flex;gap:8px;flex-wrap:wrap}
.fsel select{border:1px solid var(--rule);border-radius:10px;padding:9px 10px;background:#fff}
.tseg{display:inline-flex;border:1px solid var(--rule);border-radius:10px;background:#fff;overflow:hidden}
.tseg button{border:0;background:none;padding:8px 14px;color:var(--muted)}
.tseg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin:6px 2px 14px}
.meta button{background:none;border:0;color:var(--ink);text-decoration:underline;padding:0;font-size:13px}
.day{margin-bottom:18px}
.day header{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px 6px;border-bottom:1px solid var(--rule);font-size:13px;color:var(--muted)}
.day header strong{color:var(--ink);font-size:15px;margin-right:6px}
.day header .num{font-size:14px}
.rec{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid #E3E6DE;padding:10px 4px}
.rec:hover{background:rgba(255,255,255,.6)}
.rec.editing{background:#fff;box-shadow:inset 3px 0 0 var(--ink)}
.stamp{width:36px;height:36px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font-weight:700;font-size:16px;background:#fff}
.rec .t{min-width:0}
.rec .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec .t small{color:var(--muted);font-size:12.5px}
.rec .r{display:flex;align-items:center;gap:10px}
.rec .r img{width:30px;height:30px;object-fit:cover;border-radius:5px;border:1px solid var(--rule)}
.rec .a{font-family:var(--num);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;min-width:84px;text-align:right}
.rec .a.e{color:var(--red)} .rec .a.i{color:var(--jade)}
mark{background:var(--marker);color:inherit;padding:0 1px;border-radius:2px}
.emptyst{padding:48px 20px;text-align:center;color:var(--muted);border:1.5px dashed #C7CCC0;border-radius:12px}
.emptyst p{margin:0 0 12px}
@keyframes print{from{clip-path:inset(0 0 100% 0);background:#FFF8C9}to{clip-path:inset(0 0 0 0);background:transparent}}
.rec.fresh{animation:print .6s ease-out}

.gres{background:#F1F6FF;border:1px solid #CFDCF5;border-radius:10px;padding:10px 12px;margin:-6px 0 14px;font-size:13.5px}
.gres .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.gbar{display:flex;gap:8px;flex-wrap:wrap;margin:-6px 0 14px}
.gbar .btn{flex:1;justify-content:center;min-width:140px}
.gbar .btn.g{border-color:#4285F4;color:#1A56C9}
#pasteDlg{border:0;border-radius:14px;padding:20px;width:min(420px,92vw)}
#pasteDlg::backdrop{background:rgba(28,37,65,.45)}
#pasteDlg textarea{width:100%;height:140px;border:1px solid var(--rule);border-radius:8px;padding:8px;font-size:16px}
#cropUI{position:fixed;inset:0;z-index:30;background:#10131C;color:#fff;display:flex;flex-direction:column;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom))}
#cropUI p{margin:0 0 10px;font-size:15px;text-align:center}
.cropstage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.cropwrap{position:relative;touch-action:none;user-select:none;-webkit-user-select:none;max-width:100%;max-height:100%}
.cropwrap img{display:block;max-width:100%;max-height:calc(100vh - 150px);pointer-events:none;-webkit-user-drag:none}
#cropBox{position:absolute;border:2.5px solid #FFE45C;box-shadow:0 0 0 9999px rgba(0,0,0,.55);display:none;pointer-events:none}
.cropbar{display:flex;gap:10px;margin-top:12px}
.cropbar .btn{flex:1;justify-content:center;padding:11px;font-size:15px;background:#252A38;color:#fff;border-color:#3A4052}
.cropbar .btn.primary{background:#FFE45C;color:#1C2541;border-color:#FFE45C;font-weight:700}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;z-index:10}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:960px){
  .entrygrid{grid-template-columns:1fr}
  .slip{position:static}
  .summary{grid-template-columns:1fr}
  .totals{justify-content:flex-start;gap:28px}
  .total b{font-size:32px}
}
.tabs .ti{display:none}
.tabs .sm{display:none}
@media (max-width:720px){
  body{padding-bottom:calc(66px + env(safe-area-inset-bottom))}
  .top{padding-top:max(14px,env(safe-area-inset-top))}
  .tabs{position:fixed;left:0;right:0;bottom:0;margin:0;z-index:8;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);
    border-bottom:0;border-top:1px solid var(--rule);padding:0 0 env(safe-area-inset-bottom);justify-content:space-around;overflow:visible}
  .tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:12px;border-bottom:0;border-top:2.5px solid transparent;margin:0}
  .tabs button[aria-selected="true"]{border-color:var(--ink)}
  .tabs .ti{display:block;width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .tabs .lg{display:none}.tabs .sm{display:inline}
  .tabs .n{display:none}
  input,select,textarea,.inp{font-size:16px}
  .slip{padding:18px 16px 26px}
  .submit{position:sticky;bottom:calc(66px + env(safe-area-inset-bottom));background:var(--slip);padding:10px 0 4px;margin-top:4px;z-index:2}
  .toast{bottom:calc(80px + env(safe-area-inset-bottom))}
  .chips span{padding:6px 14px}
  .rec{padding:12px 4px}
}
@media (max-width:560px){
  .top,.summary,.wrap,.tabs{padding-left:14px;padding-right:14px}
  .tabs button{padding:10px 12px}
  .banks{grid-template-columns:1fr}
  .filters{grid-template-columns:1fr}
  .tools{gap:6px}
  .tools .btn{padding:5px 9px;font-size:13px}
  .brand h1{font-size:19px}
  .seal{width:32px;height:32px;font-size:17px}
  .total b{font-size:26px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="brand"><span class="seal" aria-hidden="true">帳</span><h1>隨手記帳</h1></div>
  <div class="tools">
    <button class="btn" id="btnCsv" title="匯出成 Excel 可開的 CSV">匯出 CSV</button>
    <button class="btn" id="btnBackup" title="下載完整備份檔">備份</button>
    <label class="btn" title="從備份檔還原">還原<input type="file" id="fileRestore" accept=".json,application/json" hidden></label>
  </div>
</header>

<nav class="tabs" role="tablist" aria-label="頁面">
  <button role="tab" data-tab="entry" aria-selected="true"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>記帳</button>
  <button role="tab" data-tab="list" aria-selected="false"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>明細<span class="n" id="nList"></span></button>
  <button role="tab" data-tab="cards" aria-selected="false"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18"/></svg><span class="lg">信用卡・行動支付</span><span class="sm">卡片</span></button>
</nav>

<section class="summary" id="summary" aria-label="期間總覽" hidden>
  <div class="period">
    <button class="arrow" id="prev" aria-label="上一期">‹</button>
    <div class="label"><strong id="periodLabel"></strong><small id="rocLabel"></small></div>
    <button class="arrow" id="next" aria-label="下一期">›</button>
    <select id="periodMode" aria-label="期間">
      <option value="month">按月</option><option value="year">按年</option>
      <option value="all">全部期間</option><option value="custom">自訂區間</option>
    </select>
    <span id="customRange" hidden>
      <input type="date" id="from" aria-label="開始日期"> 至 <input type="date" id="to" aria-label="結束日期">
    </span>
  </div>
  <div class="totals">
    <div class="total exp"><span>支出</span><b id="sumExp">0</b></div>
    <div class="total inc"><span>收入</span><b id="sumInc">0</b></div>
    <div class="total"><span>結餘</span><b id="sumBal">0</b></div>
  </div>
  <div class="breakdown">
    <div class="bar" id="bar" role="img" aria-label="分類占比"></div>
    <div class="legend" id="legend"></div>
  </div>
</section>

<main class="wrap">
 <div class="panel" id="p-entry" role="tabpanel">
 <div class="entrygrid">
  <!-- 記帳單 -->
  <aside class="slip" id="slip" aria-label="新增紀錄">
    <h2><span id="slipTitle">記一筆</span><small id="slipHint">品項打完會自動分類</small></h2>
    <div class="seg" role="group" aria-label="收支">
      <button type="button" class="e" id="tExp" aria-pressed="true">支出</button>
      <button type="button" class="i" id="tInc" aria-pressed="false">收入</button>
    </div>

    <label class="drop" id="drop">
      <div class="empty">
        拍收據自動讀金額；拍商品可以用 Google AI 查
        <div class="acts">
          <span class="btn" id="btnCam">拍照</span>
          <span class="btn" id="btnPick">選擇圖片</span>
        </div>
      </div>
      <div class="preview">
        <img id="prevImg" alt="已選擇的圖片">
        <div class="side">
          <button type="button" class="btn" id="btnOcr">重新辨識</button>
          <span class="ocrstat" id="ocrStat" aria-live="polite">選好照片會自動讀取金額</span>
                    <button type="button" class="btn" id="btnCrop">框選標籤辨識</button>
          <button type="button" class="btn danger" id="btnRmImg">移除圖片</button>
        </div>
      </div>
    </label>
    <input type="file" id="fileCam" accept="image/*" capture="environment" hidden>
    <input type="file" id="filePick" accept="image/*" hidden>
    <div class="gbar" id="gbar">
      <button type="button" class="btn g" id="btnGoogle">用 Google AI 查</button>
      <button type="button" class="btn" id="btnPaste">貼上 Google 結果</button>
      <button type="button" class="btn" id="btnAiKey">AI 設定</button>
    </div>
    <div class="gres" id="gres" hidden></div>
    <div class="cands" id="cands" aria-label="辨識結果，點選即可帶入"></div>

    <div class="field">
      <label for="item">品項</label>
      <input class="inp" id="item" placeholder="例如：午餐便當、加油、電費" autocomplete="off" list="itemHistory">
      <datalist id="itemHistory"></datalist>
    </div>
    <div class="field">
      <label for="amount">金額</label>
      <div class="amount"><span>$</span><input id="amount" inputmode="decimal" placeholder="0" autocomplete="off"></div>
    </div>
    <div class="field">
      <label for="date">日期</label>
      <input type="date" class="inp" id="date">
    </div>
    <div class="field">
      <span class="lab" id="payLab">付款方式</span>
      <div class="chips" role="radiogroup" aria-labelledby="payLab" id="payChips"></div>
      <div class="subpick" id="bankRow" hidden>
        <span class="lab2" id="bankLab">哪一家</span>
        <div class="chips" role="radiogroup" aria-labelledby="bankLab" id="bankChips"></div>
      </div>
      <div class="subpick" id="walletRow" hidden>
        <span class="lab2" id="walletLab">支付平台（選填）</span>
        <div class="chips small" role="radiogroup" aria-labelledby="walletLab" id="walletChips"></div>
      </div>
    </div>
    <div class="field">
      <span class="lab">分類</span>
      <div class="auto" id="autoNote" aria-live="polite"></div>
      <div class="row2">
        <select class="inp" id="cat" aria-label="主分類"></select>
        <select class="inp" id="sub" aria-label="細分類"></select>
      </div>
    </div>
    <div class="field">
      <label for="note">備註</label>
      <input class="inp" id="note" placeholder="選填" autocomplete="off">
    </div>

    <div class="lookup">
      <div class="lab">上網查價格</div>
      <div class="links" id="links">
        <button type="button" data-img="google" title="複製圖片後開啟 Google 以圖搜尋">以圖搜尋 Google</button>
        <button type="button" data-img="bing" title="複製圖片後開啟 Bing 視覺搜尋">以圖搜尋 Bing</button>
        <button type="button" data-q="biggo">BigGo 比價</button>
        <button type="button" data-q="gshop">Google 購物</button>
        <button type="button" data-q="momo">momo</button>
        <button type="button" data-q="pchome">PChome</button>
        <button type="button" data-q="shopee">蝦皮</button>
      </div>
    </div>

    <div class="submit">
      <button type="button" class="go" id="btnSave">記下這筆</button>
      <button type="button" class="btn" id="btnCancel" hidden>取消</button>
      <button type="button" class="btn danger" id="btnDel" hidden>刪除</button>
    </div>
  </aside>

  <section class="recent" aria-label="今天">
    <h3>今天</h3>
    <div class="todays">
      <div><span>支出</span><b id="tdExp" style="color:var(--red)">$0</b></div>
      <div><span>收入</span><b id="tdInc" style="color:var(--jade)">$0</b></div>
    </div>
    <h3>最近記的</h3>
    <div id="recent"></div>
    <button class="btn more" id="toList">看全部明細</button>
    <p id="backupNote" class="ocrstat" style="margin-top:16px" hidden></p>
  </section>
 </div>
 </div>

 <div class="panel" id="p-list" role="tabpanel" hidden>
  <!-- 明細 -->
  <section class="ledger" aria-label="明細">
    <div class="filters">
      <div class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input id="q" type="search" placeholder="搜尋品項、備註、分類、付款方式" aria-label="搜尋">
      </div>
      <div class="tseg" role="group" aria-label="收支篩選">
        <button data-t="all" aria-pressed="true">全部</button>
        <button data-t="expense" aria-pressed="false">支出</button>
        <button data-t="income" aria-pressed="false">收入</button>
      </div>
    </div>
    <div class="fsel">
      <select id="fCat" aria-label="分類篩選"></select>
      <select id="fPay" aria-label="付款方式篩選"></select>
      <select id="fBank" aria-label="卡別篩選"></select>
      <select id="fSort" aria-label="排序">
        <option value="date-desc">日期：新到舊</option>
        <option value="date-asc">日期：舊到新</option>
        <option value="amt-desc">金額：高到低</option>
        <option value="amt-asc">金額：低到高</option>
      </select>
    </div>
    <div class="meta"><span id="count"></span><button id="clearF" hidden>清除篩選</button></div>
    <div id="list"></div>
  </section>
 </div>

 <div class="panel" id="p-cards" role="tabpanel" hidden>
  <div id="cards"></div>
 </div>
</main>

<div class="toast" id="toast" role="status"></div>
<div id="cropUI" hidden role="dialog" aria-label="框選標籤">
  <p>用手指框住標籤上的品名和價格</p>
  <div class="cropstage"><div class="cropwrap" id="cropWrap"><img id="cropImg" alt="要框選的照片"><div id="cropBox"></div></div></div>
  <div class="cropbar">
    <button type="button" class="btn" id="cropCancel">取消</button>
    <button type="button" class="btn primary" id="cropOk">辨識框起來的部分</button>
  </div>
</div>
<dialog id="pasteDlg" aria-label="貼上 Google 結果">
  <p style="margin:0 0 8px;font-size:14px">把 Google 的答案貼在這裡（長按 →「貼上」）</p>
  <textarea id="pasteTxt"></textarea>
  <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px">
    <button type="button" class="btn" id="pasteCancel">取消</button>
    <button type="button" class="btn primary" id="pasteOk">帶入</button>
  </div>
</dialog>

<script>
/* ========== 分類字典 ========== */
const PAYS = ['現金','轉帳','信用卡','行動支付'];
const CARD_PAYS = ['信用卡','行動支付'];
const BANKS = ['中信','國泰'];
const BANK_COLOR = {'中信':'#3C5A99','國泰':'#2E7D4F','未指定':'#7A7F88'};
const WALLETS = ['未指定','LINE Pay','Apple Pay','Google Pay','街口','全支付','悠遊付','其他'];
const CATS = {
  expense:{

/* ========== 自動分類 ========== */
const norm=s=>String(s||'').trim().toLowerCase().replace(/\s+/g,'');
const isAscii=k=>/^[\x00-\x7f]+$/.test(k);
const reCache={};
function kwHit(raw,t,kw,ocr){
  if(isAscii(kw)){
    if(ocr&&kw.replace(/\s/g,'').length<4) return false;
    const re=reCache[kw]||(reCache[kw]=new RegExp('(^|[^a-z0-9])'+kw.toLowerCase().replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/ /g,'\\s*')+'($|[^a-z0-9])'));
    return re.test(raw);
  }
  const k=norm(kw); if(!k) return false;
  if(ocr&&k.length<2) return false;
  return t.includes(k);
}
function classify(text,ocr){
  const t=norm(text); if(!t) return null;
  const raw=String(text).toLowerCase();
  if(learn[t]) return {...learn[t],src:'learn',kw:text.trim()};
  let best=null;
  for(const k in learn){ if(k.length>=2 && t.includes(k)){const sc=k.length+10; if(!best||sc>best.sc) best={...learn[k],sc,src:'learn',kw:k}} }
  if(best) return best;
  for(const type of ['expense','income']) for(const cat in CATS[type]) for(const sub in CATS[type][cat].subs)
    for(const kw of CATS[type][cat].subs[sub]){
      if(kwHit(raw,t,kw,ocr)){
        const sc=norm(kw).length+(type==='income'?0.1:0);
        if(!best||sc>best.sc) best={type,cat,sub,sc,kw,src:'dict'};
      }
    }
  return best;
}

function setType(t,manual){

  S.type=t;
  $('#tExp').setAttribute('aria-pressed',t==='expense');

function setCat(cat,sub){

function autoClassify(){
  if(S.catManual) return;
  const text=$('#item').value+' '+$('#note').value;
  const r=classify(text), note=$('#autoNote');
  if(!$('#item').value.trim()&&!$('#note').value.trim()){note.textContent='輸入品項後會自動判斷';return}
  if(r){
    if(r.type!==S.type && !S.typeManual){ S.catManual=true; setType(r.type); S.catManual=false; }
    if(r.type===S.type){
      setCat(r.cat,r.sub);
      note.innerHTML = r.src==='learn'
        ? `照你之前的習慣歸到 <b>${esc(r.cat)} › ${esc(r.sub)}</b>`
        : `依「${esc(r.kw)}」判斷為 <b>${esc(r.cat)} › ${esc(r.sub)}</b>`;
      return;
    }
  }
  const other=S.type==='expense'?'其他':'其他收入';
  setCat(other); note.innerHTML=`還判斷不出來，先放 <b>${other}</b>，可以自己改`;
}

function resize(img,max,q){
  const s=Math.min(1,max/Math.max(img.width,img.height));
  const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/jpeg',q);
}
function ocrPrep(img){
  const s=Math.min(1,2000/Math.max(img.width,img.height));
  const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
  const x=c.getContext('2d');x.drawImage(img,0,0,c.width,c.height);
  try{
    const d=x.getImageData(0,0,c.width,c.height),a=d.data;let lo=255,hi=0;const g=new Uint8ClampedArray(a.length/4);
    for(let i=0,j=0;i<a.length;i+=4,j++){const v=a[i]*.299+a[i+1]*.587+a[i+2]*.114;g[j]=v;if(v<lo)lo=v;if(v>hi)hi=v}
    const r=Math.max(1,hi-lo);
    for(let i=0,j=0;i<a.length;i+=4,j++){const v=(g[j]-lo)*255/r;a[i]=a[i+1]=a[i+2]=v}
    x.putImageData(d,0,0);
  }catch(e){}
  return c.toDataURL('image/jpeg',.92);
}
function dhash(img){
  const c=document.createElement('canvas');c.width=9;c.height=8;const x=c.getContext('2d');
  const s=Math.min(img.width,img.height),ox=(img.width-s)/2,oy=(img.height-s)/2;

function pickAmount(lines){
  const clean=l=>l.replace(/\d{1,2}:\d{2}(:\d{2})?/g,' ').replace(/\d{2,4}\s*[\/\-.年]\s*\d{1,2}\s*[\/\-.月]\s*\d{1,2}/g,' ')
    .replace(/[OoＯ](?=\d)|(?<=\d)[OoＯ]/g,'0').replace(/(\d)\s*[,，]\s*(\d{3})(?!\d)/g,'$1$2');
  const numsOf=l=>(clean(l).match(/\d+(\.\d{1,2})?/g)||[]).filter(x=>x.replace('.','').length<7).map(Number).filter(n=>n>0&&n<1e6);
  const rules=[[/(總計|應付|實付|應收|total|amount|消費金額|交易金額|刷卡金額|特價|優惠價|會員價|折扣價|促銷價|限時價)/i,3],[/(售價|定價|單價|價格|零售價|建議售價)/,2],[/(合計|總額|總金額|金額|nt\$)/i,2],[/(小計|售價)/i,1]];
  const skip=/(原價|找零|找回|找錢|change|統編|統一編號|電話|tel|序號|卡號|機號|隨機碼|發票號碼)/i;
  let best=null;const cand=[];
  lines.forEach((l,i)=>{

  const all=lines.filter(l=>!skip.test(l)).flatMap(numsOf).filter(n=>!(n>=1900&&n<=2100&&n%1===0)&&n<100000);
  let amt=best?best.v:money.length?Math.max(...money):null;

function inPeriod(d){
  const p=S.period;
  if(p.mode==='month') return d.startsWith(`${p.y}-${String(p.m).padStart(2,'0')}`);
  if(p.mode==='year') return d.startsWith(String(p.y));
  if(p.mode==='custom') return (!p.from||d>=p.from)&&(!p.to||d<=p.to);
  return true;
}
function filtered(){
  const q=norm(S.f.q);
  let arr=records.filter(r=>inPeriod(r.date)
    &&(S.f.t==='all'||r.type===S.f.t)
    &&(!S.f.cat||r.cat===S.f.cat)
    &&(!S.f.pay||r.pay===S.f.pay)
    &&(!S.f.bank||(S.f.bank==='未指定'?CARD_PAYS.includes(r.pay)&&!r.bank:r.bank===S.f.bank))
    &&(!q||norm([r.item,r.note,r.cat,r.sub,r.pay,r.bank,r.wallet,r.amount].join(' ')).includes(q)));
  const [k,dir]=S.sort.split('-');const sg=dir==='desc'?-1:1;
  arr.sort((a,b)=>k==='amt'?(a.amount-b.amount)*sg:(a.date<b.date?-1:a.date>b.date?1:(a.created-b.created))*sg);
  return arr;
}
function hl(s){
  const q=S.f.q.trim(); s=esc(s); if(!q) return s;

}

/* ========== 信用卡・行動支付統計 ========== */
function sum(a){return a.reduce((s,r)=>s+r.amount,0)}
const CLOSE={'中信':12,'國泰':8};
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const md=s=>+s.slice(5,7)+'/'+ +s.slice(8,10);
S.cardMode='bill';S.billOff=0;
function cycle(bank,off){
  const c=CLOSE[bank],t=new Date();let y=t.getFullYear(),m=t.getMonth();
  if(t.getDate()>c) m++; m+=off;
  return {from:ymd(new Date(y,m-1,c+1)),to:ymd(new Date(y,m,c))};
}
function bankRange(k,off=S.billOff){
  if(S.cardMode!=='bill') return null;
  if(CLOSE[k]) return cycle(k,off);
  const rs=BANKS.map(b=>cycle(b,off));
  return {from:rs.map(r=>r.from).sort()[0],to:rs.map(r=>r.to).sort().pop()};
}
function inBank(r,k,off){
  const rg=bankRange(k,off);
  return rg?(r.date>=rg.from&&r.date<=rg.to):inPeriod(r.date);
}
function cycleNote(k){
  const rg=bankRange(k);if(!rg) return '';
  if(k==='未指定') return `${md(rg.from)}–${md(rg.to)}`;
  const td=today();
  if(td>rg.to) return `${md(rg.from)}–${md(rg.to)}・已於 ${md(rg.to)} 結帳`;
  if(td<rg.from) return `${md(rg.from)}–${md(rg.to)}・還沒開始`;
  const left=Math.round((new Date(rg.to+'T00:00')-new Date(td+'T00:00'))/864e5);
  return `${md(rg.from)}–${md(rg.to)}・未出帳，${left?`還有 ${left} 天結帳`:'今天結帳'}`;
}

  </div><div class="banks">`;
  for(const k of keys){
    const a=by(k), t=sum(a), cc=sum(a.filter(r=>r.pay==='信用卡')), mp=sum(a.filter(r=>r.pay==='行動支付'));

        ${a.length?`<h4>最近消費</h4>`+a.slice().sort((x,y)=>y.date<x.date?-1:y.date>x.date?1:y.created-x.created).slice(0,5).map(r=>`<button class="mrow" data-id="${r.id}"><span class="d">${md(r.date)}</span><span class="it">${esc(r.item)} <small>${r.pay==='行動支付'?esc(r.wallet||'行動支付'):'刷卡'}</small></span><span class="v">−${money(r.amount).slice(1)}</span></button>`).join(''):''}
        ${refund?`<div class="refund">另有回饋／退款 +${money(refund).slice(1)}</div>`:''}
        <button class="btn" data-bank="${k}">在明細查看${bill?'這一期':''}${k==='未指定'?'未指定卡別':k}的全部紀錄</button>
      </div></article>`;
  }
  el.innerHTML=h+'</div>'+trendHtml();
}
function trendHtml(){
  const expOf=(k,test)=>sum(records.filter(r=>r.type==='expense'&&CARD_PAYS.includes(r.pay)&&r.bank===k&&test(r)));
  if(S.cardMode==='bill'){
    const rows=[];for(let o=S.billOff-5;o<=S.billOff;o++){const v={};BANKS.forEach(b=>{const rg=cycle(b,o);v[b]={amt:expOf(b,r=>r.date>=rg.from&&r.date<=rg.to),rg}});rows.push({o,v})}
    const mx=Math.max(1,...rows.flatMap(r=>BANKS.map(b=>r.v[b].amt)));
    const lab=o=>o===0?'本期':o>0?`下 ${o} 期`:`前 ${-o} 期`;
    return `<section class="trend"><h3>近 6 期帳單</h3><table>
      <thead><tr><th>期別</th>${BANKS.map(b=>`<th>${b}（${CLOSE[b]} 號結帳）</th>`).join('')}<th style="text-align:right">合計</th></tr></thead><tbody>
      ${rows.map(r=>`<tr class="${r.o===S.billOff?'cur':''}"><td>${lab(r.o)}</td>${BANKS.map(b=>`<td><span class="tbar"><i style="width:${r.v[b].amt/mx*140}px;background:${BANK_COLOR[b]}"></i><span class="num">${money(r.v[b].amt)}</span></span><small style="color:var(--muted);font-weight:400">${md(r.v[b].rg.from)}–${md(r.v[b].rg.to)}</small></td>`).join('')}<td class="v">${money(BANKS.reduce((s,b)=>s+r.v[b].amt,0))}</td></tr>`).join('')}
      </tbody></table></section>`;
  }
  const p=S.period, base=p.mode==='month'?new Date(p.y,p.m-1,1):new Date(now.getFullYear(),now.getMonth(),1);
  const months=[];for(let i=5;i>=0;i--){const d=new Date(base.getFullYear(),base.getMonth()-i,1);months.push([d.getFullYear(),d.getMonth()+1])}
  const rows=months.map(([y,m])=>{const pre=`${y}-${String(m).padStart(2,'0')}`;const v={};BANKS.forEach(b=>v[b]=expOf(b,r=>r.date.startsWith(pre)));return {y,m,v}});
  const mx=Math.max(1,...rows.flatMap(r=>BANKS.map(b=>r.v[b])));
  return `<section class="trend"><h3>近 6 個月刷卡＋行動支付</h3><table>
    <thead><tr><th>月份</th>${BANKS.map(b=>`<th>${b}</th>`).join('')}<th style="text-align:right">合計</th></tr></thead><tbody>
    ${rows.map(r=>`<tr class="${p.mode==='month'&&r.y===p.y&&r.m===p.m?'cur':''}"><td>${r.y}/${r.m}</td>${BANKS.map(b=>`<td><span class="tbar"><i style="width:${r.v[b]/mx*160}px;background:${BANK_COLOR[b]}"></i><span class="num">${money(r.v[b])}</span></span></td>`).join('')}<td class="v">${money(BANKS.reduce((s,b)=>s+r.v[b],0))}</td></tr>`).join('')}
    </tbody></table></section>`;
}
$('#cards').onclick=e=>{
  const m=e.target.closest('.mrow');if(m){const r=records.find(x=>x.id===m.dataset.id);if(r)loadForm(r);return}
  const md_=e.target.closest('[data-mode]');if(md_){S.cardMode=md_.dataset.mode;renderAll();return}
  const b=e.target.closest('[data-bank]');if(!b)return;
  const k=b.dataset.bank, rg=bankRange(k);
  if(rg){S.period.mode='custom';S.period.from=rg.from;S.period.to=rg.to;$('#periodMode').value='custom';$('#from').value=rg.from;$('#to').value=rg.to}
  S.f={q:'',t:'expense',cat:'',pay:'',bank:k};
  $('#q').value='';$('#fCat').value='';$('#fPay').value='';$('#fBank').value=k;
  document.querySelectorAll('.tseg button[data-t]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.t==='expense'));
  showTab('list');
};

function renderAll(){
  renderPeriod();renderHistory();
  if(S.tab==='entry') renderRecent();
  renderList();
  if(S.tab==='list') renderSummary();
  if(S.tab==='cards') renderCards();
}

$('#prev').onclick=()=>{if(S.tab==='cards'&&S.cardMode==='bill'){S.billOff--;renderAll();return}const p=S.period;if(p.mode==='month'){p.m--;if(p.m<1){p.m=12;p.y--}}else p.y--;renderAll()};
$('#next').onclick=()=>{if(S.tab==='cards'&&S.cardMode==='bill'){if(S.billOff<0)S.billOff++;renderAll();return}const p=S.period;if(p.mode==='month'){p.m++;if(p.m>12){p.m=1;p.y++}}else p.y++;renderAll()};
$('#periodMode').onchange=e=>{S.period.mode=e.target.value;renderAll()};
$('#from').onchange=e=>{S.period.from=e.target.value;renderAll()};
$('#to').onchange=e=>{S.period.to=e.target.value;renderAll()};
let qT;$('#q').oninput=e=>{clearTimeout(qT);qT=setTimeout(()=>{S.f.q=e.target.value;renderAll()},120)};
document.querySelectorAll('.tseg button').forEach(b=>b.onclick=()=>{
  S.f.t=b.dataset.t;document.querySelectorAll('.tseg button').forEach(x=>x.setAttribute('aria-pressed',x===b));renderAll()});
$('#fCat').onchange=e=>{S.f.cat=e.target.value;renderAll()};
$('#fPay').onchange=e=>{S.f.pay=e.target.value;renderAll()};
$('#fSort').onchange=e=>{S.sort=e.target.value;renderList()};
$('#fBank').onchange=e=>{S.f.bank=e.target.value;renderAll()};
$('#clearF').onclick=()=>{S.f={q:'',t:'all',cat:'',pay:'',bank:''};$('#q').value='';$('#fCat').value='';$('#fPay').value='';$('#fBank').value='';
  document.querySelectorAll('.tseg button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.t==='all'));renderAll()};

/* ========== 匯出／備份 ========== */
function download(name,content,type){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
$('#btnCsv').onclick=()=>{
  const arr=filtered();if(!arr.length){toast('目前沒有可匯出的資料');return}
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const rows=[['日期','收支','主分類','細分類','品項','金額','付款方式','卡別','支付平台','備註'],
    ...arr.map(r=>[r.date,r.type==='expense'?'支出':'收入',r.cat,r.sub,r.item,r.amount,r.pay,r.bank||'',r.wallet||'',r.note])];
  download(`記帳_${today()}.csv`,'﻿'+rows.map(r=>r.map(q).join(',')).join('\r\n'),'text/csv;charset=utf-8');
  toast(`已匯出 ${arr.length} 筆（依目前篩選）`);
};
$('#btnBackup').onclick=()=>{localStorage.setItem('suishou-lastbackup',Date.now());renderAll();download(`記帳備份_${today()}.json`,JSON.stringify({v:1,records,learn,pmem}),'application/json');toast('備份檔已下載')};
$('#fileRestore').onchange=e=>{
  const f=e.target.files[0];if(!f)return;const fr=new FileReader();
  fr.onload=()=>{try{const d=JSON.parse(fr.result);const ids=new Set(records.map(r=>r.id));let n=0;
    (d.records||[]).forEach(r=>{if(r&&r.id&&!ids.has(r.id)){records.push(r);n++}});Object.assign(learn,d.learn||{});if(Array.isArray(d.pmem)){const hs=new Set(pmem.map(m=>m.h));d.pmem.forEach(m=>{if(m&&m.h&&!hs.has(m.h))pmem.push(m)})}
    persist();renderAll();toast(`已還原 ${n} 筆新紀錄`)}catch(err){toast('這不是有效的備份檔')}};
  fr.readAsText(f);e.target.value='';
};

/* ========== 範例資料 ========== */
function loadDemo(){
  const y=now.getFullYear(),m=now.getMonth(),dd=now.getDate();
  const D=(back)=>{const d=new Date(y,m,dd-back);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
  const demo=[
    [0,'雞腿便當',110,'現金'],[0,'路易莎拿鐵',75,'行動支付'],[1,'全聯 生鮮',486,'信用卡'],[1,'宵夜鹹酥雞',150,'現金'],
    [2,'中油加油',820,'信用卡'],[3,'電費',1240,'轉帳'],[3,'Netflix',390,'信用卡'],[4,'Uniqlo 外套',1290,'信用卡'],
    [5,'捷運悠遊卡加值',500,'現金'],[6,'診所掛號',150,'現金'],[7,'博客來 書',420,'信用卡'],[8,'屈臣氏 洗髮精',259,'行動支付'],
    [9,'電影票',320,'行動支付'],[10,'房租',9500,'轉帳'],[12,'朋友結婚紅包',3600,'現金'],[13,'早餐蛋餅',55,'現金'],
    [2,'11月薪水',48500,'轉帳'],[6,'夜班津貼',4200,'轉帳'],[9,'0056 配息',1860,'轉帳'],[11,'信用卡現金回饋',236,'轉帳']
  ];
  const wl=['LINE Pay','Apple Pay','街口','全支付'];
  demo.forEach(([b,item,amount,pay],i)=>{const r=classify(item)||{type:'expense',cat:'其他',sub:'其他'};
    const card=CARD_PAYS.includes(pay)||/回饋/.test(item);
    if(/回饋/.test(item)) pay='信用卡';
    records.push({id:'demo'+i+Date.now().toString(36),type:r.type,date:D(b),item,amount,cat:r.cat,sub:r.sub,pay,
      bank:card?BANKS[i%2]:'',wallet:pay==='行動支付'?wl[i%4]:'',note:'',img:null,created:Date.now()-b*86400000+i})});
  persist();renderAll();toast('已載入 20 筆範例，點任一筆可修改或刪除');
}
